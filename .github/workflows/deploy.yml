name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v7
      - name: Preparar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar as dependências
        run: npm ci
      - name: Gerar o site
        run: npm run build
      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v6
      - name: Enviar os arquivos do site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
